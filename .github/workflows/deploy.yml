name: Blue-Green Deployment to K8s

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ml-service
  BLUE_VERSION: "v1.0.0"
  GREEN_VERSION: "v1.1.0"
  K8S_PATH: "kubernetes"

jobs:
  build_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_REPO (lowercase)
        run: |
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Blue Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${{ env.BLUE_VERSION }}

      - name: Build and Push Green Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${{ env.GREEN_VERSION }}

  deploy_initial_infra:
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_REPO (lowercase)
        run: |
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy Base K8s Infrastructure
        run: |
          kubectl apply -f kubernetes/nginx-configmap.yml
          kubectl apply -f kubernetes/nginx-deployment.yml
          kubectl apply -f kubernetes/ml-service.yml

      - name: Deploy Blue ML Service
        env:
          ML_SERVICE_NAME: ml-service-blue
          ML_TIER_NAME: blue
          ML_IMAGE_VERSION: ${{ env.BLUE_VERSION }}
          CI_REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base
          envsubst < kubernetes/ml-deployment.yml | kubectl apply -f -

      - name: Set Blue as Active Service
        run: kubectl patch service ml-service-internal -p '{"spec":{"selector":{"tier":"blue"}}}'

      - name: Wait for Blue Deployment
        run: kubectl rollout status deployment/ml-service-blue --timeout=5m

  deploy_green_test:
    needs: deploy_initial_infra
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_REPO (lowercase)
        run: |
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy Green ML Service
        env:
          ML_SERVICE_NAME: ml-service-green
          ML_TIER_NAME: green
          ML_IMAGE_VERSION: ${{ env.GREEN_VERSION }}
          CI_REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base
          envsubst < kubernetes/ml-deployment.yml | kubectl apply -f -

      - name: Wait for Green Deployment
        run: kubectl rollout status deployment/ml-service-green --timeout=5m

      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: Approve switch to Green
          issue-body: Green version is tested and ready

  switch_traffic:
    needs: deploy_green_test
    runs-on: ubuntu-latest
    steps:
      - name: Set IMAGE_REPO (lowercase)
        run: |
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Switch Service Selector to Green
        run: kubectl patch service ml-service-internal -p '{"spec":{"selector":{"tier":"green"}}}'

      - name: Restart Nginx
        run: kubectl rollout restart deployment/nginx-lb

  cleanup_blue:
    needs: switch_traffic
    runs-on: ubuntu-latest
    steps:
      - name: Setup Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Cleanup Blue Deployment
        run: kubectl delete deployment ml-service-blue --ignore-not-found=true
