name: Blue-Green Deployment to kind (Single Job)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ml-service
  BLUE_VERSION: "v1.0.0"
  GREEN_VERSION: "v1.1.0"
  K8S_PATH: "kubernetes"
  KIND_CLUSTER_NAME: "ci"

jobs:
  blue_green_pipeline:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # Checkout & vars
      # ----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_OWNER (lowercase)
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Verify Dockerfile exists
        run: |
          test -f Dockerfile || (echo "ERROR: ./Dockerfile not found" && exit 1)

      # ----------------------------------------------------
      # Docker build & push
      # ----------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Blue Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.BLUE_VERSION }}

      - name: Build and Push Green Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.GREEN_VERSION }}

      # ----------------------------------------------------
      # Kubernetes (kind)
      # ----------------------------------------------------
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ----------------------------------------------------
      # Base infrastructure
      # ----------------------------------------------------
      - name: Deploy base infrastructure
        run: |
          kubectl apply -f ${{ env.K8S_PATH }}/nginx-configmap.yml
          kubectl apply -f ${{ env.K8S_PATH }}/nginx-deployment.yml
          kubectl apply -f ${{ env.K8S_PATH }}/ml-service.yml

      # ----------------------------------------------------
      # BLUE deploy
      # ----------------------------------------------------
      - name: Deploy BLUE version
        env:
          ML_SERVICE_NAME: ml-service-blue
          ML_TIER_NAME: blue
          ML_IMAGE_VERSION: ${{ env.BLUE_VERSION }}
          CI_REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base
          envsubst < ${{ env.K8S_PATH }}/ml-deployment.yml | kubectl apply -f -

      - name: Route traffic to BLUE
        run: |
          kubectl patch service ml-service-internal \
            -p '{"spec":{"selector":{"tier":"blue"}}}'

      - name: Wait for BLUE
        run: kubectl rollout status deployment/ml-service-blue --timeout=5m

      # ----------------------------------------------------
      # GREEN deploy
      # ----------------------------------------------------
      - name: Deploy GREEN version
        env:
          ML_SERVICE_NAME: ml-service-green
          ML_TIER_NAME: green
          ML_IMAGE_VERSION: ${{ env.GREEN_VERSION }}
          CI_REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
        run: |
          envsubst < ${{ env.K8S_PATH }}/ml-deployment.yml | kubectl apply -f -

      - name: Wait for GREEN
        run: kubectl rollout status deployment/ml-service-green --timeout=5m

      # ----------------------------------------------------
      # Switch traffic
      # ----------------------------------------------------
      - name: Switch Nginx backend to GREEN
        run: |
          kubectl patch configmap nginx-config --type='json' \
            -p='[{"op":"replace","path":"/data/ML_SERVICE_BACKEND","value":"ml-service-green"}]'

      - name: Restart Nginx
        run: kubectl rollout restart deployment/nginx-lb

      - name: Route traffic to GREEN
        run: |
          kubectl patch service ml-service-internal \
            -p '{"spec":{"selector":{"tier":"green"}}}'

      # ----------------------------------------------------
      # Cleanup
      # ----------------------------------------------------
      - name: Cleanup BLUE deployment
        run: kubectl delete deployment ml-service-blue --ignore-not-found=true
