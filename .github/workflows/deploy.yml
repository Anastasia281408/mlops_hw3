name: Blue-Green Deployment to kind (Single Job)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ml-service
  BLUE_VERSION: "v1.0.0"
  GREEN_VERSION: "v1.1.0"
  K8S_PATH: "kubernetes"
  KIND_CLUSTER_NAME: "ci"
  K8S_NAMESPACE: "default"

jobs:
  blue_green_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_OWNER (lowercase)
        run: |
          set -euo pipefail
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Verify required files
        run: |
          set -euo pipefail
          test -f Dockerfile || (echo "ERROR: ./Dockerfile not found" && exit 1)
          test -f "${K8S_PATH}/ml-deployment.yml" || (echo "ERROR: ${K8S_PATH}/ml-deployment.yml not found" && exit 1)
          test -f "${K8S_PATH}/nginx-configmap.yml" || (echo "ERROR: ${K8S_PATH}/nginx-configmap.yml not found" && exit 1)
          test -f "${K8S_PATH}/nginx-deployment.yml" || (echo "ERROR: ${K8S_PATH}/nginx-deployment.yml not found" && exit 1)
          test -f "${K8S_PATH}/ml-service.yml" || (echo "ERROR: ${K8S_PATH}/ml-service.yml not found" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Blue Image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.BLUE_VERSION }}

      - name: Build and Push Green Image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.GREEN_VERSION }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Verify cluster
        run: |
          set -euo pipefail
          kubectl cluster-info
          kubectl get nodes

      - name: Create imagePullSecret for GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          kubectl -n "${K8S_NAMESPACE}" delete secret ghcr-creds --ignore-not-found=true
          kubectl -n "${K8S_NAMESPACE}" create secret docker-registry ghcr-creds \
            --docker-server="${REGISTRY}" \
            --docker-username="${GHCR_USER}" \
            --docker-password="${GHCR_TOKEN}"
          kubectl -n "${K8S_NAMESPACE}" patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-creds"}]}' || true

      - name: Deploy base infrastructure
        run: |
          set -euo pipefail
          kubectl apply -f "${K8S_PATH}/nginx-configmap.yml"
          kubectl apply -f "${K8S_PATH}/nginx-deployment.yml"
          kubectl apply -f "${K8S_PATH}/ml-service.yml"

      - name: Wait for Nginx
        run: |
          set -euo pipefail
          kubectl rollout status deployment/nginx-lb --timeout=5m

      - name: Deploy BLUE
        env:
          ML_SERVICE_NAME: ml-service-blue
          ML_TIER_NAME: blue
          ML_IMAGE_VERSION: ${{ env.BLUE_VERSION }}
          CI_REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext-base
          envsubst < "${K8S_PATH}/ml-deployment.yml" | kubectl apply -f -

      - name: Route traffic to BLUE
        run: |
          set -euo pipefail
          kubectl patch service ml-service-internal -p '{"spec":{"selector":{"tier":"blue"}}}'

      - name: Wait for BLUE
        run: |
          set -euo pipefail
          kubectl rollout status deployment/ml-service-blue --timeout=5m

      - name: Deploy GREEN
        env:
          ML_SERVICE_NAME: ml-service-green
          ML_TIER_NAME: green
          ML_IMAGE_VERSION: ${{ env.GREEN_VERSION }}
          CI_REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          envsubst < "${K8S_PATH}/ml-deployment.yml" | kubectl apply -f -

      - name: Wait for GREEN
        run: |
          set -euo pipefail
          kubectl rollout status deployment/ml-service-green --timeout=5m

      - name: Route traffic to GREEN
        run: |
          set -euo pipefail
          kubectl patch service ml-service-internal -p '{"spec":{"selector":{"tier":"green"}}}'

      - name: Cleanup BLUE
        run: |
          set -euo pipefail
          kubectl delete deployment ml-service-blue --ignore-not-found=true

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== ALL RESOURCES ==="
          kubectl get all -n "${K8S_NAMESPACE}" || true
          echo "=== PODS ==="
          kubectl get pods -n "${K8S_NAMESPACE}" -o wide || true
          echo "=== EVENTS (last 200) ==="
          kubectl get events -n "${K8S_NAMESPACE}" --sort-by=.lastTimestamp | tail -n 200 || true
