version: '3.8'
services:
  ml-service-green:
    build: .
    image: ml-service:v1.1.0
    container_name: ml-service-green
    environment:
      - MODEL_VERSION=v1.1.0
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-lb
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx_green.conf:/etc/nginx/nginx.conf:ro # Использует Green конфиг
    depends_on:
      - ml-service-green
